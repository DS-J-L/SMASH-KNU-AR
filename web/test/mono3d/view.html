<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>근사 3D PC 화면</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./view.css?v=20261109-4">
</head>
<body>
  <header>
    <h1>카메라 1대 근사 3D <small>source=mono_approx · 시험용</small></h1>
    <p id="status" class="status">서버에 연결 중…</p>
    <button id="sound" type="button">소리 켜기</button>
  </header>
  <main>
    <section class="pane">
      <h2>폰 영상 <small id="videoInfo"></small></h2>
      <div class="stage"><canvas id="video" width="480" height="640" aria-label="폰 카메라 영상과 추정 결과"></canvas></div>
    </section>
    <section class="pane wide">
      <h2>3D 보기 <small>끌어서 돌리기 · 휠로 확대 · 두 번 눌러 처음 시점</small></h2>
      <div class="stage"><canvas id="scene" width="900" height="640" aria-label="위치 3D 보기"></canvas>
        <div id="hitPop" class="pop" hidden>💥</div>
      </div>
    </section>
    <aside class="pane side">
      <div class="score"><span>건물 타격</span><b id="hits">0</b></div>
      <dl id="info"></dl>
      <p class="hint">폰에서 <b>/test/mono3d/</b>를 열고 4단계 <b>측정</b>까지 진행하면 여기에 나타납니다. 앞뒤(카메라 방향) 거리가 가장 부정확합니다.</p>
    </aside>
  </main>
  <script type="module" src="./view.js?v=20261109-4"></script>
</body>
</html>
